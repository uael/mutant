[package]
name = "puns"
version = "0.1.0"
edition.workspace = true
rust-version = "1.100"
license = "Apache-2.0 OR MIT"
description = "Type punning proven at compile time: a safe alternative to transmute and to hand-written parsing of bytes"
repository = "https://github.com/uael/puns"
documentation = "https://docs.rs/puns"
readme = "../README.md"
keywords = ["transmute", "zero-copy", "parsing", "bytes", "no-std"]
categories = ["encoding", "parsing", "no-std", "rust-patterns"]
# The specification, for contributors: not shipped.
exclude = ["CLAUDE.md"]

[features]
# Test-only, for `puns-model`: `puns::hook`, what the analysis says of a
# pun without failing to compile. Not part of the API; nothing else changes with it.
verdict = []
# Regions of the crate `nearest`: `Pun` for its pointers, its offsets in a given byte order
# (`i32le`...), and loaders that check the bytes of a region from the layouts (`puns::nearest`).
nearest = ["dep:nearest"]

[dependencies]
puns-derive = { version = "=0.1.0", path = "../puns-derive" }
# This very release: the loaders of `puns::nearest` state again the byte format of a region and
# use hidden items of `nearest` (see `DESIGN.md`), which another release may change.
nearest = { version = "=0.7.1", optional = true, default-features = false, features = ["alloc"] }

[package.metadata.docs.rs]
features = ["nearest"]

[dev-dependencies]
trybuild = "1"

# What needs the feature `nearest` is not built without it.
[[example]]
name = "codegen_nearest"
required-features = ["nearest"]

[[example]]
name = "ir"
required-features = ["nearest"]

[[test]]
name = "ir"
required-features = ["nearest"]

[[test]]
name = "nearest"
required-features = ["nearest"]

[[test]]
name = "nearest_compile_fail"
required-features = ["nearest"]

[lints]
workspace = true
