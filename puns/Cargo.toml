[package]
name = "puns"
version = "0.1.2"
edition.workspace = true
rust-version = "1.100"
license = "Apache-2.0 OR MIT"
description = "Type punning proven at compile time: a safe alternative to transmute and to hand-written parsing of bytes"
repository = "https://github.com/uael/puns"
documentation = "https://docs.rs/puns"
readme = "README.md"
keywords = ["transmute", "zero-copy", "parsing", "bytes", "no-std"]
categories = ["encoding", "parsing", "no-std", "rust-patterns"]

[features]
# Test-only, for `puns-model`: `puns::hook`, what the analysis says of a
# pun without failing to compile. Not part of the API; nothing else changes with it.
verdict = []

[dependencies]
puns-derive = { version = "=0.1.2", path = "../puns-derive" }

[dev-dependencies]
trybuild = "1"

# What is checked at run time, next to the same checks by hand: `cargo bench -p puns`. Not a test.
[[bench]]
name = "checks"
harness = false

[lints]
workspace = true
