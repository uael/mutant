[package]
name = "transmutant"
version = "0.1.0"
edition.workspace = true
rust-version = "1.100"
license = "Apache-2.0 OR MIT"
description = "Safe transmutation checked at compile time, on stable Rust"
repository = "https://github.com/uael/mutant"
documentation = "https://docs.rs/transmutant"
readme = "../README.md"
keywords = ["transmute", "zero-copy", "parsing", "bytes", "no-std"]
categories = ["encoding", "parsing", "no-std", "rust-patterns"]
# The specification, for contributors: not shipped.
exclude = ["CLAUDE.md"]

[dependencies]
transmutant-derive = { version = "=0.1.0", path = "../transmutant-derive" }

[lints]
workspace = true
