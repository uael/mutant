name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      # Unit, integration, compile-fail (trybuild) and doc tests. It builds every example, and runs
      # each of them through its test (`tests/ethernet.rs`...), which asserts its results.
      - run: cargo test --all

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --tests --examples --benches -- -D warnings

  no_std:
    name: No std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # A target without `std`: nothing may need it.
      - run: cargo build -p puns --target thumbv7em-none-eabihf

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rustfmt.toml` uses unstable options.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-17
          components: rustfmt
      - run: cargo +nightly-2026-11-17 fmt --all -- --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all
        env:
          RUSTDOCFLAGS: -D warnings

  # One job for each run, side by side: each is a check of its own, of less than a minute.
  miri:
    name: Miri (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The trybuild test is ignored under Miri, the examples other than `ethernet` not built.
          - name: tree borrows
            args: -p puns --tests
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          - name: stacked borrows
            args: -p puns --tests
            flags: -Zmiri-strict-provenance
          # 32 bits: a smaller `usize`, a `u64` aligned to 4.
          - name: 32 bits
            args: -p puns --tests --target i686-unknown-linux-gnu
            flags: -Zmiri-strict-provenance
          # The model check under Miri: a selection of pairs that runs every unsafe path it
          # reaches (see `puns-model/tests/miri_sample.rs`); the verdicts of every pair are the
          # job of the full native run, in `model.yml`.
          - name: model
            args: -p puns-model
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-17
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo +nightly-2026-11-17 miri test ${{ matrix.args }}
        env:
          MIRIFLAGS: ${{ matrix.flags }}

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm rust-toolchain
      - uses: EmbarkStudios/cargo-deny-action@v2
