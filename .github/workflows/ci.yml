name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On demand, on any branch: to read the times of the jobs again without a commit (the first
  # run after a change of a cache key has nothing cached).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      # Unit, integration, compile-fail (trybuild) and doc tests. It builds every example, and runs
      # each of them through its test (`tests/ethernet.rs`...), which asserts its results. With the
      # job below, this is `cargo test --all`, in two halves that each fit in a minute.
      - run: cargo test --workspace --exclude puns-model

  # The sample of the model check that every push runs (the exhaustive one is `model.yml`): about
  # as long to build as everything else, so jobs of its own, one for whole puns and one for
  # parts. Together they are `cargo test -p puns-model`.
  model:
    name: Model check (sample, ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: puns
            tests: >-
              --lib --test miri_sample --test core_shadowed --test dst --test regressions
              --test pointers
          - name: parts
            tests: --test parts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: model
      - run: cargo test -p puns-model ${{ matrix.tests }}

  clippy:
    name: Clippy, documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --tests --examples --benches -- -D warnings
      # The documentation, in the same job: the same toolchain, a few seconds more.
      - run: cargo doc --no-deps --all
        env:
          RUSTDOCFLAGS: -D warnings

  no_std:
    name: No std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # A target without `std`: nothing may need it.
      - run: cargo build -p puns --target thumbv7em-none-eabihf
      # A 16-bit target (a `usize` of 16 bits, `isize::MAX` of 32 KiB, see "What `usize` is assumed
      # to be" in `DESIGN.md`), whose `core` is built from source on the pinned nightly.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-17
          components: rust-src
      - run: cargo +nightly-2026-11-17 build -p puns -Zbuild-std=core --target msp430-none-elf

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rustfmt.toml` uses unstable options.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-17
          components: rustfmt
      - run: cargo +nightly-2026-11-17 fmt --all -- --check

  # One job for each run, side by side: each is a check of its own, of less than a minute.
  miri:
    name: Miri (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      # Every `cargo` of the job is the nightly one: without this, the first one that is not
      # asked for it (the one of the cache action) installs the toolchain of `rust-toolchain`,
      # ten seconds for a compiler that the job does not use.
      RUSTUP_TOOLCHAIN: nightly-2026-11-17
      # Where Miri keeps the standard library that it builds for its target: twenty seconds of
      # build, so a directory that is cached (below).
      MIRI_SYSROOT: /home/runner/miri-sysroot
      # The sources that it builds it from, which the toolchain installs.
      MIRI_SOURCES: >-
        /home/runner/.rustup/toolchains/nightly-2026-11-17-x86_64-unknown-linux-gnu/lib/rustlib/src
    strategy:
      fail-fast: false
      matrix:
        include:
          # Of the tests of `puns`, the ones that Miri runs (see the step that selects them), in
          # two jobs for each run: every other test file each.
          - name: tree borrows, 1 of 2
            id: tree
            args: -p puns
            select: true
            half: 1
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          - name: tree borrows, 2 of 2
            id: tree
            args: -p puns
            select: true
            half: 2
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          # Stacked borrows, on a big-endian target: what loads integers, sums and CRCs several
          # bytes at a time must not depend on the byte order of the target, and the rules of
          # stacked borrows do not depend on the target (x86-64 has the two jobs above).
          - name: stacked borrows, big-endian, 1 of 2
            id: stacked-s390x
            args: -p puns
            target: s390x-unknown-linux-gnu
            select: true
            half: 1
            flags: -Zmiri-strict-provenance
          - name: stacked borrows, big-endian, 2 of 2
            id: stacked-s390x
            args: -p puns
            target: s390x-unknown-linux-gnu
            select: true
            half: 2
            flags: -Zmiri-strict-provenance
          # 32 bits: a smaller `usize`, a `u64` aligned to 4.
          - name: 32 bits, 1 of 2
            id: i686
            args: -p puns
            target: i686-unknown-linux-gnu
            select: true
            half: 1
            flags: -Zmiri-strict-provenance
          - name: 32 bits, 2 of 2
            id: i686
            args: -p puns
            target: i686-unknown-linux-gnu
            select: true
            half: 2
            flags: -Zmiri-strict-provenance
          # The model check under Miri: a selection of pairs that runs every unsafe path it
          # reaches (see `puns-model/tests/miri_sample.rs`); the verdicts of every pair are the
          # job of the full native run, in `model.yml`.
          # In three jobs: whole puns, parts and unsized types, self-relative pointers.
          - name: model, puns
            id: model
            args: -p puns-model --lib --test miri_sample --test core_shadowed --test regressions
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          - name: model, parts
            id: model
            args: -p puns-model --test parts --test dst
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          # Pointers: views that are made and read through, and checked at run time.
          - name: model, pointers
            id: model
            args: -p puns-model --test pointers
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-17
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          # Not the name: a key of a cache has no comma.
          key: ${{ matrix.id }}
      # The standard library of Miri, for the toolchain and the target: built by the step after
      # this one when the cache does not have it. With the sources it was built from: Miri
      # builds it again when the modification time of one of them is not what it was, and each
      # run installs them anew. The cache brings them back as they were.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.MIRI_SYSROOT }}
            ${{ env.MIRI_SOURCES }}
          key: miri-std-nightly-2026-11-17-${{ matrix.target || 'host' }}
      - run: cargo miri setup ${{ matrix.target && format('--target {0}', matrix.target) }}
      # A test file that is not for Miri says so (`#![cfg(not(miri))]`: the examples other than
      # `ethernet`, the trybuild test, what is about the derive and not the unsafe code). With
      # `--tests`, each would still be a binary that Miri starts to run nothing, a second each.
      - name: Select the tests that Miri runs
        if: matrix.select
        run: |
          tests=$(grep -L 'cfg(not(miri))' puns/tests/*.rs | sed 's|.*/|--test |; s|\.rs$||')
          case "${{ matrix.half }}" in
            1) tests="--lib $(echo "$tests" | awk 'NR % 2 == 1')" ;;
            2) tests=$(echo "$tests" | awk 'NR % 2 == 0') ;;
            *) tests="--lib $tests" ;;
          esac
          echo "TESTS=$(echo $tests)" >> "$GITHUB_ENV"
      - run: >-
          cargo miri test ${{ matrix.args }}
          ${{ matrix.target && format('--target {0}', matrix.target) }} $TESTS
        env:
          MIRIFLAGS: ${{ matrix.flags }}

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm rust-toolchain
      - uses: EmbarkStudios/cargo-deny-action@v2
