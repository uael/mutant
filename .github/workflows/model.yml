name: Model check

# The exhaustive model check: every pair of the types of the model, every part, every value over
# the alphabets (`puns-model/tests/size*.rs` and `parts*.rs`, behind the `full` feature, which
# `cargo test` does not build). It takes minutes to build and two to run, too long for every push,
# where CI runs a sample of it: here on demand, and every night.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  model:
    name: Model check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Optimized: the `model` profile is the release one without LTO.
      - run: cargo test --profile model -p puns-model --features full
      # The tests that CI does not build on a push.
      - run: cargo clippy -p puns-model --tests --features full -- -D warnings
      # The same for self-relative pointers (feature `nearest`): every pair of the types of
      # `puns_model::pointers`, every value of every byte of their images given to the loaders.
      - run: cargo test --profile model -p puns-model --features nearest,full --test pointers_full
      - run: cargo clippy -p puns-model --tests --features nearest,full -- -D warnings
      # What pointers aim at is proven by functions that are named and never called (`deep.rs`):
      # their `const` blocks are evaluated because the compiler makes whatever is named, which
      # the compile-fail tests hold it to in a debug build. Here in an optimized one, with LTO:
      # the same program (a `u8` read as a `bool` two pointers down) must be refused, for the
      # same reason. It is a check of the compiler: run it when `rust-toolchain` changes.
      - name: A wrong view behind pointers is refused by an optimized build
        env:
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: |
          cp puns/tests/compile-fail-nearest/view_behind_pointers.rs puns/examples/refused.rs
          if cargo build -p puns --release --features nearest --example refused 2> log; then
            echo "a wrong view compiled"
            exit 1
          fi
          grep "behind a pointer, some values of the source are not valid for the target" log
