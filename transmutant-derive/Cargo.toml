[package]
name = "transmutant-derive"
version = "0.1.0"
edition.workspace = true
rust-version = "1.100"
license = "Apache-2.0 OR MIT"
description = "The #[derive(Data)] macro for the transmutant crate"
repository = "https://github.com/uael/mutant"
documentation = "https://docs.rs/transmutant-derive"
readme = "../README.md"
keywords = ["transmute", "zero-copy", "derive", "macro"]
categories = ["encoding"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
