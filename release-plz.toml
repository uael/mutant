[workspace]
git_tag_enable = true
git_release_enable = true
# Publish only when a release PR (a branch whose name starts with `release-plz-`) is merged, never
# on an ordinary push to `main`: without it, the first push would publish 0.1.0, which is not on
# crates.io yet. The first release is the merge of the first release PR.
release_always = false

# The two crates are released under one version: the higher of their next versions.
[[package]]
name = "transmutant"
version_group = "transmutant"
changelog_path = "CHANGELOG.md"
changelog_include = ["transmutant-derive"]
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

[[package]]
name = "transmutant-derive"
version_group = "transmutant"
changelog_update = false
git_tag_enable = false
git_release_enable = false

[[package]]
name = "xtask"
publish = false
changelog_update = false
git_tag_enable = false
git_release_enable = false

[[package]]
name = "transmutant-model"
publish = false
changelog_update = false
git_tag_enable = false
git_release_enable = false

[[package]]
name = "fakecore"
publish = false
changelog_update = false
git_tag_enable = false
git_release_enable = false
